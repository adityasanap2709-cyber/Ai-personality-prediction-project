<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI OCEAN Personality Prediction</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .container{
            width:650px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            color:#333;
        }

        textarea{
            width:100%;
            height:180px;
            padding:10px;
            font-size:16px;
            margin-top:20px;
            border:1px solid #ccc;
            border-radius:5px;
            resize:none;
            box-sizing:border-box;
        }

        input[type=file]{
            width:100%;
            padding:10px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:5px;
            background:white;
            box-sizing:border-box;
        }

        .or{
            text-align:center;
            font-weight:bold;
            margin:20px 0;
            color:#666;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:25px;
            font-size:18px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        label{
            font-weight:bold;
            color:#333;
        }

    </style>

</head>
<body>

<div class="container">

<h1>AI-Based OCEAN Personality Prediction</h1>

<form action="/predict" method="POST" enctype="multipart/form-data">

    <label>Enter Text</label>

    <textarea
        name="text"
        placeholder="Enter your social media post here..."></textarea>

    <div class="or">OR</div>

    <label>Upload Screenshot (PNG, JPG, JPEG)</label>

    <input
        type="file"
        name="image"
        accept=".png,.jpg,.jpeg">

    <button type="submit">
        Predict Personality
    </button>

</form>

</div>

</body>
</html>
